# Development only. Container UID 0 maps to the rootless daemon's host user.
x-rootless-php: &rootless-php
    user: root
    environment:
        FPM_USER: root
        FPM_GROUP: root
        COMPOSER_ALLOW_SUPERUSER: "1"

services:
    php:
        <<: *rootless-php
    php-xdebug:
        <<: *rootless-php
