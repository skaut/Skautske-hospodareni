ServerName moje-hospodareni.cz

<VirtualHost *:80>
    ServerName moje-hospodareni.cz
    DocumentRoot /app/www
    DirectoryIndex index.php index.html

    # Everything else (front controller, headers, cache, redirects) comes from www/.htaccess, as on the hosting.
    <Directory /app/www>
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch "\.php$">
        <If "%{HTTP_COOKIE} =~ /(^|;\s*)XDEBUG_SESSION=PHPSTORM(;|$)/">
            SetHandler "proxy:fcgi://${PHP_FPM_XDEBUG_ADDRESS}"
        </If>
        <Else>
            SetHandler "proxy:fcgi://${PHP_FPM_ADDRESS}"
        </Else>
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
