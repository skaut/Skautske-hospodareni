[global]
daemonize = no
error_log = /app/log/php-fpm-error.log

[www]
user = docker
group = docker
listen = 9000

access.log = /app/log/php-fpm-access.log
catch_workers_output = yes
decorate_workers_output = no

pm = dynamic
pm.max_children = 20
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 5
clear_env = no
