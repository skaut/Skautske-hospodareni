; Replaces Debian's www.conf. Listening on :9000, logging, clear_env and the worker user (FPM_USER) come from
; the image's zz-fpm.conf; this pool keeps enough workers for parallel browser tests.
[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 5
