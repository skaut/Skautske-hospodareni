[global]
daemonize = no
error_log = /proc/self/fd/2

[www]
user = docker
group = docker
listen = 9000

access.log = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no

; Process manager settings are set by PHP_FPM_PM_* in ini/image.ini; the image's zz-docker-pm.conf applies them.
clear_env = no
