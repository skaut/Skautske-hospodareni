services:
    php:
        build:
            context: ..
            dockerfile: docker/containers/php/Dockerfile.ci

    php-xdebug:
        build:
            context: ..
            dockerfile: docker/containers/php/Dockerfile.ci

    php-test:
        build:
            context: ..
            dockerfile: docker/containers/php/Dockerfile.ci
        networks:
            traefik:
                aliases:
                    - php
                    - php-xdebug
                    - php-test

    nginx:
        image: ${COMPOSE_PROJECT_NAME:-hskauting}-nginx-ci
        build:
            context: ..
            dockerfile: docker/containers/nginx/Dockerfile.ci
        depends_on: !override
            - php-test
